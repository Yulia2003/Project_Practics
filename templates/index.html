<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подсчет посетителей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Подсчет посетителей в магазине</h1>
    <div class="row">
        <div class="col-md-6">
            <form id="upload-form" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">Загрузите видео или изображение</label>
                    <input type="file" class="form-control" id="file" name="file" accept="video/*,image/*" required>
                </div>
                <button type="submit" class="btn btn-primary">Обработать</button>
            </form>
            <div id="loading" class="mt-3" style="display: none;">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                <span>Обработка...</span>
            </div>
            <div class="mt-3">
                <button id="start-camera" class="btn btn-success">Запустить камеру</button>
                <button id="stop-camera" class="btn btn-danger" style="display: none;">Остановить камеру</button>
            </div>
            <div id="stream-error" class="mt-2 text-danger" style="display: none;"></div>
            <div id="live-stream-section" class="mt-4" style="display: none;">
                <h4>Онлайн просмотр</h4>
                <img id="live-stream" class="img-fluid border rounded" alt="Видеопоток">
            </div>
        </div>
        <div class="col-md-6">
            <h3>Результаты</h3>
            <div id="results" class="mt-3">
                <p id="status"></p>
                <p id="max-people"></p>
                <p id="unique-people"></p>
                <p id="frame-count"></p>
                <ul id="intervals"></ul>
            </div>
            <a href="/export_excel" class="btn btn-info mt-2">Скачать отчет (Excel)</a>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col">
            <h3>История запросов</h3>
            <table class="table table-striped" id="history-table">
                <thead>
                <tr>
                    <th>Время</th>
                    <th>Файл</th>
                    <th>Макс. людей</th>
                    <th>Уникальных людей</th>
                    <th>Кадров</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        const maxPeople = document.getElementById('max-people');
        const uniquePeople = document.getElementById('unique-people');
        const frameCount = document.getElementById('frame-count');
        const intervalsList = document.getElementById('intervals');
        const liveStreamSection = document.getElementById('live-stream-section');
        const liveStreamImg = document.getElementById('live-stream');
        const streamError = document.getElementById('stream-error');

        // Очистка результатов и ошибок
        status.innerHTML = '';
        maxPeople.textContent = '';
        uniquePeople.textContent = '';
        frameCount.textContent = '';
        intervalsList.innerHTML = '';
        liveStreamSection.style.display = 'none';
        liveStreamImg.src = '';
        streamError.style.display = 'none';

        loading.style.display = 'block';

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);

            const data = await response.json();
            console.log('Ответ сервера:', data);

            if (data.error) {
                status.innerHTML = `<span class="text-danger">${data.error}</span>`;
                return;
            }

            status.innerHTML = '<span class="text-success">Обработка завершена успешно</span>';
            maxPeople.textContent = `Максимальное количество людей в кадре: ${data.max_people}`;
            uniquePeople.textContent = `Общее количество уникальных людей: ${data.unique_people}`;
            frameCount.textContent = `Обработано кадров: ${data.frame_count}`;

            data.intervals.forEach((interval, index) => {
                const li = document.createElement('li');
                li.textContent = `Человек ${index + 1}: Кадры ${interval[0]}–${interval[1]} (длительность: ${interval[1] - interval[0]} кадров)`;
                intervalsList.appendChild(li);
            });

            if (data.output_image) {
                liveStreamImg.src = `/Uploads/${encodeURIComponent(data.output_image)}`;
                liveStreamSection.style.display = 'block';
            } else {
                const streamUrl = `/video_feed?filename=${encodeURIComponent(data.filename)}`;
                liveStreamImg.src = streamUrl;
                liveStreamSection.style.display = 'block';

                // Проверка загрузки потока
                liveStreamImg.onerror = () => {
                    streamError.textContent = 'Ошибка: Не удалось загрузить видеопоток. Проверьте файл или сервер.';
                    streamError.style.display = 'block';
                    liveStreamImg.src = '';
                    liveStreamSection.style.display = 'none';
                };

                // Повторная попытка через 2 секунды, если поток не загрузился
                setTimeout(() => {
                    if (!liveStreamImg.complete || liveStreamImg.naturalWidth === 0) {
                        liveStreamImg.src = ''; // Сброс
                        liveStreamImg.src = streamUrl; // Повторная попытка
                        console.log('Повторная попытка загрузки потока:', streamUrl);
                    }
                }, 2000);
            }

            await loadHistory();
        } catch (error) {
            console.error('Ошибка:', error);
            status.innerHTML = `<span class="text-danger">Ошибка обработки: ${error.message}</span>`;
        } finally {
            loading.style.display = 'none';
        }
    });

    const startCameraBtn = document.getElementById('start-camera');
    const stopCameraBtn = document.getElementById('stop-camera');
    const liveStreamSection = document.getElementById('live-stream-section');
    const liveStreamImg = document.getElementById('live-stream');
    const streamError = document.getElementById('stream-error');

    startCameraBtn.addEventListener('click', () => {
        const streamUrl = '/camera_feed';
        liveStreamImg.src = streamUrl;
        liveStreamSection.style.display = 'block';
        startCameraBtn.style.display = 'none';
        stopCameraBtn.style.display = 'inline-block';
        streamError.style.display = 'none';

        // Проверка ошибки загрузки стрима
        liveStreamImg.onerror = () => {
            streamError.textContent = 'Ошибка: Не удалось запустить камеру. Проверьте доступность камеры.';
            streamError.style.display = 'block';
            liveStreamImg.src = '';
            liveStreamSection.style.display = 'none';
            startCameraBtn.style.display = 'inline-block';
            stopCameraBtn.style.display = 'none';
        };

        // Повторная попытка через 2 секунды, если поток не загрузился
        setTimeout(() => {
            if (!liveStreamImg.complete || liveStreamImg.naturalWidth === 0) {
                liveStreamImg.src = ''; // Сброс
                liveStreamImg.src = streamUrl; // Повторная попытка
                console.log('Повторная попытка загрузки потока камеры:', streamUrl);
            }
        }, 2000);
    });

    stopCameraBtn.addEventListener('click', () => {
        liveStreamImg.src = '';
        liveStreamSection.style.display = 'none';
        startCameraBtn.style.display = 'inline-block';
        stopCameraBtn.style.display = 'none';
        streamError.style.display = 'none';
    });

    async function loadHistory() {
        try {
            const response = await fetch('/history');
            if (!response.ok) throw new Error('Ошибка получения истории');

            const history = await response.json();
            if (history.error) {
                console.error('Ошибка истории:', history.error);
                return;
            }

            const tbody = document.querySelector('#history-table tbody');
            tbody.innerHTML = '';

            history.forEach(entry => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${new Date(entry.timestamp).toLocaleString()}</td>
                    <td>${entry.filename || entry.video_filename || 'Unknown'}</td>
                    <td>${entry.max_people}</td>
                    <td>${entry.unique_people}</td>
                    <td>${entry.frame_count}</td>
                `;
                tbody.appendChild(row);
            });
        } catch (error) {
            console.error('Ошибка загрузки истории:', error);
        }
    }

    window.onload = loadHistory;
</script>
</body>
</html>
